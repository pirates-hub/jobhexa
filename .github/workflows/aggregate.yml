name: aggregate-jobs
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Single source id (optional)'
        required: false
        default: ''
jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: aggregator
        run: npm install
      - working-directory: aggregator
        run: node index.js --once ${{ inputs.source && format('--source {0}', inputs.source) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: jobs-export
          path: |
            aggregator/data/jobs.json
            aggregator/data/jobs.csv
            aggregator/data/health.json

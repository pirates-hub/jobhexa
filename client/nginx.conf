# JobHexa frontend: static SPA + /api reverse proxy to the backend.
# (Vite's dev proxy only exists in development — this replaces it in prod.)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Backend API (same-origin /api, cookies included)
  location /api/ {
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 90s;
  }

  # Static assets: cache aggressively (Vite hashes filenames)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: deep links like /jobs/some-job resolve to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}

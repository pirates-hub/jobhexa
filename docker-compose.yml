# JobHexa production stack.
#
# DATABASE: MongoDB is PRIVATE to this network (no published ports).
#   - Preferred: use Atlas — put your mongodb+srv:// URI in server/.env as
#     MONGODB_URI. Atlas only accepts the host's outbound IP if you list it
#     under Network Access (use 0.0.0.0/0 only for testing).
#   - The local `mongo` service is a fallback for offline use; reachable ONLY
#     inside this compose network. To use it, set in server/.env:
#       MONGODB_URI=mongodb://mongo:27017/jobhexa
#
# BACKEND: run EXACTLY ONE server replica. Reminder + collection crons live
#   inside the server process — a second replica would send duplicate mails
#   and create duplicate collection runs.
#
# OLLAMA: removed — AI runs on Groq cloud. Set OPENAI_API_KEY in
# server/.env (key from console.groq.com, free, no card).
services:
  mongo:
    image: mongo:7
    # No ports: private to the compose network.
    volumes:
      - mongo-data:/data/db
  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file: ./server/.env
    depends_on:
      - mongo
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - server
volumes:
  mongo-data:
